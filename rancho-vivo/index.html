<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rancho Vivo">
<meta name="robots" content="noindex">
<title>Rancho Vivo</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
<link rel="stylesheet" href="app.css">
<style>
/* Bienvenida: el mismo ícono de la app se dibuja en dorado y luego aparece el inicio. */
#bienvenida { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 26px;
  background: radial-gradient(120% 80% at 50% 36%, #4A433B 0%, #2A2622 70%); color: #F3E7C9; overflow: hidden;
  transition: opacity .45s ease, transform .45s ease; }
#bienvenida.fuera { opacity: 0; transform: scale(1.04); pointer-events: none; }
#bienvenida .lomas-b { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 26vh; }
#bienvenida .ficha { width: min(46vw, 190px); aspect-ratio: 1; border-radius: 22.5%; overflow: hidden; position: relative;
  box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(201,162,39,.18); animation: b-entra .6s cubic-bezier(.2,.9,.3,1.2) both; }
#bienvenida .ficha svg { width: 100%; height: 100%; display: block; }
#bienvenida .trazo { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
#bienvenida .aro { animation: b-traza .8s .25s cubic-bezier(.6,0,.2,1) forwards; }
#bienvenida .aro-fino { opacity: 0; animation: b-aparece .5s .85s ease forwards; }
#bienvenida .toro path { animation: b-traza .7s cubic-bezier(.6,0,.2,1) forwards; }
#bienvenida .toro path:nth-child(1) { animation-delay: .7s; }
#bienvenida .toro path:nth-child(2) { animation-delay: .85s; }
#bienvenida .toro path:nth-child(3) { animation-delay: 1.15s; }
#bienvenida .toro path:nth-child(4) { animation-delay: 1s; }
#bienvenida .brillo { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,236,170,.32) 50%, transparent 65%);
  transform: translateX(-120%); animation: b-brillo .9s 1.45s ease-in-out forwards; }
#bienvenida .nombre { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 28px; letter-spacing: .06em; text-align: center; line-height: 1.2;
  opacity: 0; animation: b-sube .6s 1.1s ease forwards; }
#bienvenida .nombre small { display: block; font-family: "Inter", system-ui, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: .18em;
  text-transform: uppercase; color: #C9A227; margin-top: 6px; }
@keyframes b-entra { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@keyframes b-traza { 0% { stroke-dashoffset: 1; opacity: 0; } 4% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
@keyframes b-aparece { to { opacity: .55; } }
@keyframes b-sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes b-brillo { to { transform: translateX(120%); } }
@media (prefers-reduced-motion: reduce) {
  #bienvenida *, #bienvenida { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .2s !important; }
}
</style>
</head>
<body>
<div id="bienvenida" aria-hidden="true">
  <svg class="lomas-b" viewBox="0 0 512 120" preserveAspectRatio="none"><path d="M0 50 C90 12 170 24 256 42 C350 62 430 28 512 12 V120 H0Z" fill="#5A4030" opacity=".85"/><path d="M0 84 C110 56 200 72 290 84 C380 96 450 78 512 68 V120 H0Z" fill="#7A4B2A"/></svg>
  <div class="ficha">
    <svg viewBox="0 0 512 512">
      <defs><radialGradient id="b-luz" cx="50%" cy="34%" r="70%"><stop offset="0" stop-color="#4A433B"/><stop offset="1" stop-color="#2A2622"/></radialGradient></defs>
      <rect width="512" height="512" fill="url(#b-luz)"/>
      <path d="M0 418 C90 380 170 392 256 410 C350 430 430 396 512 380 V512 H0Z" fill="#5A4030" opacity=".85"/>
      <path d="M0 452 C110 424 200 440 290 452 C380 464 450 446 512 436 V512 H0Z" fill="#7A4B2A"/>
      <circle class="trazo aro" pathLength="1" cx="256" cy="236" r="150" fill="none" stroke="#C9A227" stroke-width="12" stroke-linecap="round" transform="rotate(-90 256 236)"/>
      <circle class="aro-fino" cx="256" cy="236" r="130" fill="none" stroke="#C9A227" stroke-width="3"/>
      <g class="toro" transform="translate(136 125.375) scale(3.75)" stroke="#C9A227" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="trazo" pathLength="1" d="M10 15c1 8 6 12 13 12M54 15c-1 8-6 12-13 12"/>
        <path class="trazo" pathLength="1" d="M21 25h22l-2.5 17.5a8.6 8.6 0 0 1-17 0z"/>
        <path class="trazo" pathLength="1" d="M27 44h10"/>
        <path class="trazo" pathLength="1" d="M15 24.5c-3 .2-5 2-5.5 4.5 3 .9 6 .6 8.5-1M49 24.5c3 .2 5 2 5.5 4.5-3 .9-6 .6-8.5-1"/>
      </g>
    </svg>
    <span class="brillo"></span>
  </div>
  <div class="nombre">Rancho Vivo<small>Ganado y dinero del rancho</small></div>
</div>
<div id="app" aria-live="polite">
  <div class="arranque"></div>
</div>
<div id="aviso" role="status"></div>
<dialog id="hoja" aria-labelledby="hoja-titulo"></dialog>
<script>
// La bienvenida dura lo que tarda la animación (2.3 s); la app se arma detrás mientras tanto.
(function () {
  var b = document.getElementById('bienvenida'), corto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function () { b.classList.add('fuera'); setTimeout(function () { b.remove(); }, 500); }, corto ? 500 : 2300);
})();
</script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
